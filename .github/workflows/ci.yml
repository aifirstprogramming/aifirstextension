name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 supports running .ts files directly via type-stripping,
          # which is what `node scripts/sync-content.ts --check` relies on.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Content sync gate
        run: node scripts/sync-content.ts --check

      - name: Install xvfb
        # xvfb is present on the ubuntu-latest image today but is not part of
        # the setup-node action's contract; install it explicitly so a base
        # image change does not silently skip the extension host tests.
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Extension host tests
        run: xvfb-run -a npm test
