name: Release

# Two stages, so the file readers install is the exact file that was checked:
#
# 1. Push a version tag (v1.12.0). CI runs on the tagged commit, the VSIX is
#    built once, and it is attached with its SHA-256 to a *draft* GitHub
#    Release. Nothing reaches the Marketplace.
# 2. Install that VSIX in the lab and run the acceptance checks
#    (docs/releasing.md). Then run this workflow by hand with the tag. It
#    downloads the same VSIX, checks the hash, publishes it to the Marketplace
#    and publishes the GitHub Release.
#
# The version comes from package.json, set in a normal pull request. This
# workflow never commits or pushes.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag whose draft release VSIX passed acceptance, e.g. v1.12.0'
        required: true
        type: string

jobs:
  # Nothing is built for release unless the full CI (unit, content gate, host
  # tests on all three OSes against the minimum and certified Stable builds,
  # packaging) passes on the tagged commit.
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION. Bump the version in a pull request, then tag that commit."
            exit 1
          fi

      - name: Package VSIX
        run: |
          VSIX="ai-first-programming-${GITHUB_REF_NAME}.vsix"
          npx --yes @vscode/vsce@3.6.0 package --out "$VSIX"
          sha256sum "$VSIX" > "$VSIX.sha256"
          cat "$VSIX.sha256"

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section."
            exit 1
          fi

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "ai-first-programming-${GITHUB_REF_NAME}.vsix" \
            "ai-first-programming-${GITHUB_REF_NAME}.vsix.sha256"

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repository settings to
    # make publishing need a second person's approval.
    environment: marketplace
    permissions:
      contents: write
    steps:
      - name: Download the accepted VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "ai-first-programming-$TAG.vsix" \
            --pattern "ai-first-programming-$TAG.vsix.sha256"
          sha256sum --check "ai-first-programming-$TAG.vsix.sha256"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Publish to the Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          TAG: ${{ inputs.tag }}
        run: npx --yes @vscode/vsce@3.6.0 publish --packagePath "ai-first-programming-$TAG.vsix"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
