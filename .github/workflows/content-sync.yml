name: Content sync

on:
  repository_dispatch:
    types: [content-released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Content release tag (e.g. v1.4.0)'
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # Default GITHUB_TOKEN can push to this repo's main branch because
          # this repo has no branch protection today; the sync automation
          # would need re-wiring if that changes.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          TAG="${{ github.event.client_payload.tag || github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "No tag provided from either repository_dispatch payload or workflow_dispatch input." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Bootstrap install
        run: npm ci

      - name: Sync content (script bumps the pin, reinstalls, reconciles the fixture)
        id: sync
        run: |
          set -o pipefail
          node scripts/sync-content.ts --tag "${{ steps.tag.outputs.tag }}" --accept-content-changes \
            | tee sync-output.log
          grep '^DELTA_JSON:' sync-output.log | sed 's/^DELTA_JSON://' > "$RUNNER_TEMP/delta.json"
          # Expose delta counts as step outputs for the commit/issue text below.
          echo "old_count=$(jq -r .oldCount "$RUNNER_TEMP/delta.json")" >> "$GITHUB_OUTPUT"
          echo "new_count=$(jq -r .newCount "$RUNNER_TEMP/delta.json")" >> "$GITHUB_OUTPUT"
          echo "changed_count=$(jq -r '.changed | length' "$RUNNER_TEMP/delta.json")" >> "$GITHUB_OUTPUT"
          echo "retired_count=$(jq -r '.retired | length' "$RUNNER_TEMP/delta.json")" >> "$GITHUB_OUTPUT"
          echo "added_count=$(jq -r '.added | length' "$RUNNER_TEMP/delta.json")" >> "$GITHUB_OUTPUT"
          echo "carried_count=$(jq -r '.carried | length' "$RUNNER_TEMP/delta.json")" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Content sync gate
        run: node scripts/sync-content.ts --check

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Extension host tests
        run: xvfb-run -a npm test

      - name: Bump extension version, write CHANGELOG and plan, commit and push
        if: success()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          OLD_COUNT: ${{ steps.sync.outputs.old_count }}
          NEW_COUNT: ${{ steps.sync.outputs.new_count }}
          CARRIED: ${{ steps.sync.outputs.carried_count }}
          CHANGED: ${{ steps.sync.outputs.changed_count }}
          ADDED: ${{ steps.sync.outputs.added_count }}
          RETIRED: ${{ steps.sync.outputs.retired_count }}
        run: |
          set -euo pipefail
          # Only commit if the reconciliation actually changed anything.
          if [ "$CHANGED" = "0" ] && [ "$ADDED" = "0" ] && [ "$RETIRED" = "0" ]; then
            echo "No content differences after sync to $TAG; nothing to commit."
            exit 0
          fi

          NEW_VERSION=$(npm version minor --no-git-tag-version | sed 's/^v//')
          DATE=$(date -u +%Y-%m-%d)

          # CHANGELOG entry naming every changed and retired prompt from delta.json.
          CHANGED_LIST=$(jq -r '.changed[]? | "- Changed: \(.)"' "$RUNNER_TEMP/delta.json")
          RETIRED_LIST=$(jq -r '.retired[]? | "- Retired: \(.)"' "$RUNNER_TEMP/delta.json")
          ADDED_LIST=$(jq -r '.added[]? | "- Added: \(.)"' "$RUNNER_TEMP/delta.json")
          {
            echo "## $NEW_VERSION - $DATE"
            echo
            echo "Sync content to $TAG ($OLD_COUNT -> $NEW_COUNT prompts). $CARRIED carried, $CHANGED changed, $ADDED added, $RETIRED retired."
            echo
            [ -n "$CHANGED_LIST" ] && echo "$CHANGED_LIST"
            [ -n "$RETIRED_LIST" ] && echo "$RETIRED_LIST"
            [ -n "$ADDED_LIST" ] && echo "$ADDED_LIST"
            echo
            cat CHANGELOG.md
          } > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

          # Automated build record.
          mkdir -p docs/ai/plans
          PLAN=docs/ai/plans/${DATE}-content-sync-${TAG}.md
          {
            echo "<!-- Automated run of content-sync.yml. Do not edit: this is a historical record. -->"
            echo
            echo "> **Automated content sync: build record.**"
            echo "> This entry was generated by \`.github/workflows/content-sync.yml\` when \`@aifirst/content\`"
            echo "> was released at $TAG. See the sibling commit for the code change."
            echo ">"
            echo "> | | |"
            echo "> | --- | --- |"
            echo "> | **Tag** | \`$TAG\` |"
            echo "> | **Date** | $DATE |"
            echo "> | **Extension version** | $NEW_VERSION |"
            echo "> | **Delta** | $OLD_COUNT -> $NEW_COUNT prompts ($CARRIED carried, $CHANGED changed, $ADDED added, $RETIRED retired) |"
            echo
            echo "# Content sync to $TAG"
            echo
            echo "Regenerated the golden fixture against the new pack. Full delta is in the commit body."
          } > "$PLAN"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          RETIRED_TEXT=$(jq -r '.retired[]? | "- \(.)"' "$RUNNER_TEMP/delta.json")
          {
            echo "Sync content to $TAG ($OLD_COUNT -> $NEW_COUNT prompts)"
            echo
            echo "Regenerated the golden fixture. $CARRIED prompts unchanged, $CHANGED changed,"
            echo "$ADDED added, $RETIRED retired upstream when exercises were revised."
            echo
            if [ -n "$RETIRED_TEXT" ]; then
              echo "Retired:"
              echo "$RETIRED_TEXT"
            fi
          } > commit-message.txt

          git commit -F commit-message.txt
          rm commit-message.txt
          git push origin main

      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Read the delta scratch file if the sync step wrote one before failing; otherwise
          # report just the tag and workflow URL so oncall has a starting point.
          BODY="Content sync to $TAG failed. See the workflow run for the failing step: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f "$RUNNER_TEMP/delta.json" ]; then
            BODY="$BODY

          Delta at failure time:
          \`\`\`
          $(cat "$RUNNER_TEMP/delta.json")
          \`\`\`"
          fi
          gh issue create \
            --title "Content sync to $TAG failed" \
            --body "$BODY" \
            --repo "${{ github.repository }}"
